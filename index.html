<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Дневник ПТК</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 select-none pb-24">

    <div class="max-w-md mx-auto space-y-4">
        <!-- Шапка -->
        <div class="flex justify-between items-center bg-slate-800/60 p-3.5 rounded-2xl border border-slate-700/50">
            <div class="flex items-center gap-2">
                <span class="text-xl">📊</span>
                <h1 class="text-lg font-bold tracking-tight">Дневник ПТК</h1>
                <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full font-mono">v3.7</span>
            </div>
            <button type="button" onclick="hardReset()" class="text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-xl transition">
                Сброс
            </button>
        </div>

        <!-- Навигация (3 вкладки) -->
        <div id="mainNav" class="grid grid-cols-3 gap-1.5">
            <button type="button" onclick="switchSection('marks')" id="navMarksBtn" class="bg-indigo-600 text-white py-2.5 rounded-xl font-medium text-xs transition shadow-md flex items-center justify-center gap-1">
                <span>📊</span> Оценки
            </button>
            <button type="button" onclick="switchSection('schedule')" id="navScheduleBtn" class="bg-slate-800 text-slate-400 border border-slate-700 py-2.5 rounded-xl font-medium text-xs transition flex items-center justify-center gap-1">
                <span>📅</span> Расписание
            </button>
            <button type="button" onclick="switchSection('changes')" id="navChangesBtn" class="bg-slate-800 text-slate-400 border border-slate-700 py-2.5 rounded-xl font-medium text-xs transition flex items-center justify-center gap-1">
                <span>⚡</span> Замены
            </button>
        </div>

        <!-- РАЗДЕЛ 1: ОЦЕНКИ -->
        <div id="marksSection" class="space-y-4">
            <div class="space-y-2">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Мои предметы</span>
                    <button type="button" onclick="openAddSubject()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">➕ Добавить предмет</button>
                </div>
                <div id="subjectsTabs" class="flex gap-2 overflow-x-auto pb-1"></div>
            </div>

            <div id="studentCard" class="bg-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-lg border border-slate-700/50 hidden">
                <div>
                    <div id="studentDisplay" class="font-bold text-base text-white">ФИО Студента</div>
                    <div id="groupDisplay" class="text-xs text-slate-400 mt-0.5">Группа</div>
                </div>
                <button type="button" onclick="loadMarksForActiveSubject()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-xs font-medium transition">
                    🔄 Обновить
                </button>
            </div>

            <div id="marksList" class="space-y-2.5"></div>
        </div>

        <!-- РАЗДЕЛ 2: РАСПИСАНИЕ -->
        <div id="scheduleSection" class="space-y-4 hidden">
            <div class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700/50 space-y-3">
                <div class="flex justify-between items-center">
                    <div>
                        <div id="schedHeaderInfo" class="font-bold text-sm text-white">Группа не выбрана</div>
                        <div id="schedSubInfo" class="text-xs text-slate-400 mt-0.5">Укажи номер своей группы</div>
                    </div>
                    <button type="button" onclick="loadScheduleFromServer()" class="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-xl text-xs transition">🔄</button>
                </div>

                <div class="flex gap-2 pt-1">
                    <input type="text" id="groupInput" placeholder="Например: 5952" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
                    <button type="button" onclick="saveAndLoadScheduleGroup()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-xs font-bold shrink-0 transition">Загрузить</button>
                </div>

                <div class="grid grid-cols-2 gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-700/60">
                    <button type="button" onclick="setWeekType('upper')" id="btnUpperWeek" class="py-2 rounded-lg text-xs font-medium transition bg-indigo-600 text-white shadow">⬆️ Верхняя неделя</button>
                    <button type="button" onclick="setWeekType('lower')" id="btnLowerWeek" class="py-2 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white">⬇️ Нижняя неделя</button>
                </div>
            </div>

            <div id="scheduleList" class="space-y-3"></div>
        </div>

        <!-- РАЗДЕЛ 3: ЗАМЕНЫ -->
        <div id="changesSection" class="space-y-4 hidden">
            <div class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700/50 space-y-3">
                <div class="flex justify-between items-center gap-2">
                    <div>
                        <div id="changesHeaderTitle" class="font-bold text-sm text-white">⚡ Изменения в расписании</div>
                        <div id="changesStatusText" class="text-xs text-indigo-300 mt-0.5">Нажми «🔄 С сайта» для загрузки</div>
                    </div>
                    <div class="flex gap-1.5 shrink-0">
                        <label class="cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-xl text-xs font-medium transition">
                            📁 .docx
                            <input type="file" accept=".docx,.doc,.xls,.xlsx" onchange="handleManualChangesFile(event)" class="hidden">
                        </label>
                        <button type="button" onclick="fetchChangesFromPortal()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl text-xs font-bold transition shadow-md">
                            🔄 С сайта
                        </button>
                    </div>
                </div>

                <div class="space-y-1.5 pt-2 border-t border-slate-700/60">
                    <div class="text-[11px] text-slate-400">Фильтр по группе:</div>
                    <div id="changesGroupFilter" class="flex gap-1.5 overflow-x-auto pb-1"></div>
                </div>
            </div>

            <div id="changesList" class="space-y-2.5"></div>
        </div>

        <!-- ЭКРАН ДОБАВЛЕНИЯ ПРЕДМЕТА -->
        <div id="setupScreen" class="bg-slate-800 p-5 rounded-2xl shadow-lg space-y-4 border border-slate-700/50 hidden">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-base">Подключение предмета</h2>
                <button type="button" onclick="switchSection('marks')" class="text-xs text-slate-400 hover:text-white">Отмена</button>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">1. Название предмета</label>
                <input type="text" id="subjectNameInput" placeholder="Например: Дискретная математика" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1">2. Ссылка на Google Таблицу</label>
                <div class="flex gap-2">
                    <input type="text" id="sheetLinkInput" placeholder="https://docs.google.com/spreadsheets/d/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <button type="button" id="scanTabsBtn" onclick="fetchGroupsList()" class="bg-indigo-600 hover:bg-indigo-500 px-4 rounded-xl text-xs font-semibold shrink-0 transition">Найти группы</button>
                </div>
            </div>
            <div id="groupSelectBlock" class="hidden space-y-2 pt-3 border-t border-slate-700/60">
                <label class="block text-xs text-emerald-400 font-medium">3. Выберите вашу группу:</label>
                <div id="groupsButtonsContainer" class="flex flex-wrap gap-2"></div>
            </div>
            <div id="studentSelectBlock" class="hidden space-y-3 pt-3 border-t border-slate-700">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">4. Выберите своё ФИО:</label>
                    <select id="studentSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500"></select>
                </div>
                <button type="button" onclick="saveSubjectProfile()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-medium py-3 rounded-xl transition">✅ Сохранить предмет</button>
            </div>
        </div>
    </div>

    <script>
        try {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.expand();
            }
        } catch (e) {}

        const STORAGE_MARKS_KEY = 'ptk_diary_subjects_v3';
        const STORAGE_SCHED_KEY = 'ptk_diary_schedules_v7';
        const STORAGE_CHANGES_KEY = 'ptk_diary_changes_v6';
        const RENDER_URL = 'https://dnevnik-1.onrender.com';

        let subjects = [], activeSubjectIndex = 0;
        let currentScheduleGroup = localStorage.getItem('ptk_active_group') || '';
        let currentSelectedWeek = 'upper';
        let selectedGroupForMarks = '';
        let cachedScheduleData = null;

        let changesData = { dateTitle: 'Изменения в расписании', fileName: 'С сайта НовГУ', items: [] };
        let activeChangesGroupFilter = 'ALL';
        let tempMarksWorkbook = null;

        document.addEventListener('DOMContentLoaded', function() {
            try { subjects = JSON.parse(localStorage.getItem(STORAGE_MARKS_KEY)) || []; } catch(e) { subjects = []; }
            try {
                const sc = JSON.parse(localStorage.getItem(STORAGE_CHANGES_KEY));
                if (sc && Array.isArray(sc.items)) changesData = sc;
            } catch(e) {}

            currentSelectedWeek = getInitialWeekType();
            updateWeekButtonsUI();

            const known = getKnownUserGroups();
            if (known.length > 0 && activeChangesGroupFilter === 'ALL') activeChangesGroupFilter = known[0];

            if (currentScheduleGroup) {
                document.getElementById('groupInput').value = currentScheduleGroup;
                loadScheduleFromServer();
            }

            if (subjects.length === 0 && !currentScheduleGroup) switchSection('schedule');
            else switchSection('marks');
        });

        function getKnownUserGroups() {
            const s = new Set();
            if (currentScheduleGroup) s.add(currentScheduleGroup);
            subjects.forEach(x => { if (x && x.groupName && /^\d{4}$/.test(String(x.groupName))) s.add(String(x.groupName)); });
            return Array.from(s);
        }

        function getInitialWeekType() {
            const now = new Date();
            const year = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
            const septFirst = new Date(year, 8, 1);
            const diffDays = Math.ceil(Math.abs(now - septFirst) / (1000 * 60 * 60 * 24));
            return (Math.ceil(diffDays / 7) % 2 !== 0) ? 'upper' : 'lower';
        }

        function setWeekType(type) {
            currentSelectedWeek = type;
            updateWeekButtonsUI();
            if (cachedScheduleData) renderScheduleHTML(cachedScheduleData);
        }

        function updateWeekButtonsUI() {
            const u = document.getElementById('btnUpperWeek'), l = document.getElementById('btnLowerWeek');
            if (!u || !l) return;
            u.className = currentSelectedWeek === 'upper' ? "py-2 rounded-lg text-xs font-medium transition bg-indigo-600 text-white shadow" : "py-2 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white";
            l.className = currentSelectedWeek === 'lower' ? "py-2 rounded-lg text-xs font-medium transition bg-indigo-600 text-white shadow" : "py-2 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white";
        }

        function switchSection(section) {
            document.getElementById('mainNav').classList.remove('hidden');
            document.getElementById('setupScreen').classList.add('hidden');

            const navs = { marks: 'navMarksBtn', schedule: 'navScheduleBtn', changes: 'navChangesBtn' };
            const secs = { marks: 'marksSection', schedule: 'scheduleSection', changes: 'changesSection' };
            const act = "bg-indigo-600 text-white py-2.5 rounded-xl font-medium text-xs transition shadow-md flex items-center justify-center gap-1";
            const inact = "bg-slate-800 text-slate-400 border border-slate-700 py-2.5 rounded-xl font-medium text-xs transition flex items-center justify-center gap-1 hover:text-slate-200";

            Object.keys(navs).forEach(k => {
                document.getElementById(navs[k]).className = (k === section) ? act : inact;
                document.getElementById(secs[k]).classList.toggle('hidden', k !== section);
            });

            if (section === 'marks') { renderSubjectTabs(); loadMarksForActiveSubject(); }
            else if (section === 'schedule') { if (currentScheduleGroup && !cachedScheduleData) loadScheduleFromServer(); }
            else if (section === 'changes') { renderChangesGroupFilter(); renderChangesList(); }
        }

        // ================= ЗАМЕНЫ С СЕРВЕРА =================
        async function fetchChangesFromPortal() {
            const statusEl = document.getElementById('changesStatusText');
            const listEl = document.getElementById('changesList');
            statusEl.innerText = "⏳ Скачиваем с сайта...";
            listEl.innerHTML = '<div class="text-center text-slate-400 py-8 animate-pulse text-sm">Получаем свежие замены...</div>';

            try {
                const res = await fetch(`${RENDER_URL}/api/changes`);
                if (!res.ok) throw new Error("Сервер не смог скачать файл замен");
                const arrayBuffer = await res.arrayBuffer();
                await parseChangesBuffer(arrayBuffer, "Замены с портала НовГУ");
            } catch (e) {
                statusEl.innerText = "Ошибка загрузки";
                listEl.innerHTML = `<div class="bg-slate-800 p-4 rounded-2xl text-center text-amber-400 text-xs">⚠️ ${e.message}</div>`;
            }
        }

        function handleManualChangesFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) { await parseChangesBuffer(e.target.result, file.name); };
            reader.readAsArrayBuffer(file);
        }

        async function parseChangesBuffer(arrayBuffer, fileName) {
            try {
                if (window.mammoth && !/\.xlsx?$/i.test(fileName)) {
                    try {
                        const result = await mammoth.convertToHtml({ arrayBuffer: arrayBuffer });
                        if (result && result.value) { parseDocxHtmlChanges(result.value, fileName); return; }
                    } catch (e) {}
                }
                const workbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: "" });
                parseRawRowsToChanges(rows, "Изменения в расписании", fileName);
            } catch (err) { alert("Ошибка чтения файла: " + err.message); }
        }

        function parseDocxHtmlChanges(htmlString, fileName) {
            const doc = new DOMParser().parseFromString(htmlString, 'text/html');
            let dateTitle = "Изменения в расписании";
            doc.querySelectorAll('p').forEach(p => {
                const t = p.textContent.replace(/\s+/g, ' ').trim();
                if (/на\s+\d+/i.test(t) || /неделя/i.test(t)) dateTitle = "Замены " + t;
            });
            const rows = [];
            doc.querySelectorAll('table tr').forEach(tr => {
                const cols = [];
                tr.querySelectorAll('td, th').forEach(td => cols.push(td.textContent.replace(/\s+/g, ' ').trim()));
                if (cols.some(c => c.length > 0)) rows.push(cols);
            });
            parseRawRowsToChanges(rows, dateTitle, fileName);
        }

        function parseRawRowsToChanges(rows, dateTitle, fileName) {
            const items = [];
            let lastGroupRaw = '';
            for (let r = 0; r < rows.length; r++) {
                const row = rows[r].map(c => String(c || '').trim());
                const c0 = row[0] || '', c1 = row[1] || '', c2 = row[2] || '', c3 = row[3] || '', c4 = row[4] || '';
                const fullRowText = row.join(' ');
                if (/групп|дисциплина|методист|запомнить|недели|изменение|изменения|расписании|\d{2}\.\d{2}\.\d{4}/i.test(fullRowText)) continue;
                if (!c2 && !c3 && !c1) continue;

                const groupRaw = c0 || lastGroupRaw;
                if (c0 && /\d{4}/.test(c0)) lastGroupRaw = c0;

                const groups = groupRaw.match(/\d{4}/g) || [];
                const cleanPair = c1.replace(/\D/g, '');
                if (!/^[1-7]$/.test(cleanPair)) continue;

                items.push({ groupRaw: groupRaw || '—', groups, pair: cleanPair, oldLesson: c2 || '—', newLesson: c3 || '', aud: c4 || '' });
            }
            changesData = { dateTitle, fileName, items };
            localStorage.setItem(STORAGE_CHANGES_KEY, JSON.stringify(changesData));
            document.getElementById('changesStatusText').innerText = `Загружено замен: ${items.length}`;
            renderChangesGroupFilter();
            renderChangesList();
        }

        function renderChangesGroupFilter() {
            const container = document.getElementById('changesGroupFilter');
            container.innerHTML = '';
            const groupsSet = new Set(['ALL', ...getKnownUserGroups()]);
            (changesData.items || []).forEach(it => (it.groups || []).forEach(g => groupsSet.add(g)));

            groupsSet.forEach(g => {
                const isSelected = activeChangesGroupFilter === g;
                const cls = isSelected ? "bg-indigo-600 text-white border-indigo-500 shadow" : "bg-slate-900 text-slate-400 border-slate-700";
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `px-3 py-1.5 border rounded-xl text-xs font-medium shrink-0 transition ${cls}`;
                btn.textContent = g === 'ALL' ? 'Все группы' : 'Гр. ' + g;
                btn.onclick = () => { activeChangesGroupFilter = g; renderChangesGroupFilter(); renderChangesList(); };
                container.appendChild(btn);
            });
        }

        function renderChangesList() {
            const container = document.getElementById('changesList');
            if (!changesData.items || changesData.items.length === 0) {
                container.innerHTML = `<div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 text-center space-y-2"><div class="text-slate-300 text-sm font-medium">Замены ещё не загружены</div><div class="text-slate-400 text-xs">Нажми <b>«🔄 С сайта»</b> выше</div></div>`;
                return;
            }
            if (changesData.dateTitle) document.getElementById('changesHeaderTitle').innerText = `⚡ ${changesData.dateTitle}`;
            const filtered = changesData.items.filter(it => {
                if (activeChangesGroupFilter === 'ALL') return true;
                return (it.groups || []).includes(activeChangesGroupFilter) || String(it.groupRaw).includes(activeChangesGroupFilter);
            });
            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-slate-800/50 p-6 rounded-2xl text-center text-slate-300 text-sm border border-slate-700/40">🎉 Для группы <b>${activeChangesGroupFilter}</b> замен нет!</div>`;
                return;
            }
            let html = '';
            filtered.forEach(it => {
                const isCancelled = /не\s*будет|отмен/i.test(it.aud) || /не\s*будет|отмен/i.test(it.newLesson);
                const audBadge = isCancelled ? `<span class="bg-red-500/20 text-red-300 border border-red-500/30 px-2.5 py-0.5 rounded-lg text-xs font-bold">🚫 ${it.aud || 'Не будет'}</span>` : (it.aud ? `<span class="bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 px-2.5 py-0.5 rounded-lg text-xs font-bold">🚪 Ауд. ${it.aud}</span>` : '');
                html += `
                    <div class="bg-slate-800 p-4 rounded-2xl shadow border border-slate-700/50 space-y-2.5">
                        <div class="flex justify-between items-center border-b border-slate-700/60 pb-2">
                            <div class="flex items-center gap-2"><span class="bg-indigo-600 text-white px-2.5 py-0.5 rounded-lg text-xs font-bold">Гр. ${it.groupRaw}</span><span class="text-xs font-mono text-indigo-300 font-semibold">${it.pair} пара</span></div>
                            ${audBadge}
                        </div>
                        <div class="space-y-1.5 text-xs">
                            <div class="text-slate-400"><span class="text-[10px] uppercase text-slate-500 block">По расписанию:</span><span class="line-through">${it.oldLesson}</span></div>
                            <div class="text-slate-100 font-medium bg-slate-900/60 p-2.5 rounded-xl border border-slate-700/40"><span class="text-[10px] uppercase text-amber-400 block mb-0.5">Изменение:</span>${it.newLesson || (isCancelled ? 'Занятие отменено (Не будет)' : '—')}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // ================= РАСПИСАНИЕ С СЕРВЕРА =================
        function saveAndLoadScheduleGroup() {
            const g = document.getElementById('groupInput').value.trim();
            if (!g) { alert("Введи номер группы!"); return; }
            currentScheduleGroup = g;
            localStorage.setItem('ptk_active_group', g);
            loadScheduleFromServer();
        }

        async function loadScheduleFromServer() {
            if (!currentScheduleGroup) return;
            const container = document.getElementById('scheduleList');
            document.getElementById('schedHeaderInfo').innerText = `Группа: ${currentScheduleGroup}`;
            document.getElementById('schedSubInfo').innerText = "Загружаем с сервера...";
            container.innerHTML = '<div class="text-center text-slate-400 py-8 animate-pulse text-sm">Получаем расписание...</div>';

            try {
                const res = await fetch(`${RENDER_URL}/api/schedule/${currentScheduleGroup}`);
                if (!res.ok) throw new Error("Группа не найдена на сервере");
                const data = await res.json();
                cachedScheduleData = data;
                renderScheduleHTML(data);
            } catch (e) {
                container.innerHTML = `<div class="bg-slate-800 p-6 rounded-2xl text-center text-amber-400 text-xs">⚠️ ${e.message}</div>`;
            }
        }

        function isCellMergedVertically(merges, r, c) {
            return (merges || []).some(m => m.s.r === r && m.e.r > r && c >= m.s.c && c <= m.e.c);
        }

        function renderScheduleHTML(data) {
            const container = document.getElementById('scheduleList');
            const rows = data.rows, merges = data.merges || [], groupColIdx = data.groupColIdx, headerRowIdx = data.headerRowIdx;
            const timeColIdx = groupColIdx - 1, dayColIdx = groupColIdx - 2;
            let daysSchedule = {}, currentDay = "Понедельник";

            for (let r = headerRowIdx + 1; r < rows.length; r++) {
                let row = rows[r];
                if (!row) continue;
                let dayCandidate = String(row[dayColIdx] || row[0] || '').trim().toLowerCase();
                if (/^(понедельник|вторник|среда|четверг|пятница|суббота)$/.test(dayCandidate)) {
                    currentDay = dayCandidate.charAt(0).toUpperCase() + dayCandidate.slice(1);
                }

                let timeVal = String(row[timeColIdx] || row[1] || '').trim();
                if (!/\d{1,2}[\.:]\d{2}\s*-\s*\d{1,2}[\.:]\d{2}/.test(timeVal)) continue;

                let upperVal = String(rows[r][groupColIdx] || '').trim();
                let nextRow = rows[r + 1] || [];
                let lowerVal = String(nextRow[groupColIdx] || '').trim();
                let nextTimeVal = String(nextRow[timeColIdx] || nextRow[1] || '').trim();
                let hasSecondRow = !(/\d{1,2}[\.:]\d{2}\s*-\s*\d{1,2}[\.:]\d{2}/.test(nextTimeVal));
                let isMerged = isCellMergedVertically(merges, r, groupColIdx);

                if (isMerged || !hasSecondRow) lowerVal = upperVal;
                let chosenLesson = currentSelectedWeek === 'upper' ? upperVal : lowerVal;

                if (chosenLesson && chosenLesson !== '-' && chosenLesson !== '—' && !/Зам\.\s*директора/i.test(chosenLesson)) {
                    if (!daysSchedule[currentDay]) daysSchedule[currentDay] = [];
                    daysSchedule[currentDay].push({
                        time: timeVal,
                        lesson: chosenLesson,
                        onlyThisWeek: (!isMerged && hasSecondRow && upperVal !== lowerVal)
                    });
                }
            }

            let html = '';
            for (let [day, lessons] of Object.entries(daysSchedule)) {
                html += `<div class="bg-slate-800 p-4 rounded-2xl shadow border border-slate-700/40 space-y-2"><h3 class="font-bold text-indigo-400 text-sm border-b border-slate-700/60 pb-1.5">${day}</h3><div class="space-y-1.5">`;
                lessons.forEach(l => {
                    const badge = l.onlyThisWeek ? `<span class="text-[10px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded ml-1">${currentSelectedWeek === 'upper' ? 'верх' : 'низ'}</span>` : '';
                    html += `<div class="text-xs flex gap-2.5 items-start bg-slate-900/50 p-2.5 rounded-xl border border-slate-700/30"><span class="font-mono text-indigo-300 font-semibold shrink-0 pt-0.5">${l.time}</span><div class="text-slate-200 leading-snug">${l.lesson} ${badge}</div></div>`;
                });
                html += `</div></div>`;
            }
            document.getElementById('schedSubInfo').innerText = `Лист: ${data.sheet} (${currentSelectedWeek === 'upper' ? 'Верхняя' : 'Нижняя'} неделя)`;
            container.innerHTML = html || '<div class="text-slate-400 text-center py-8 bg-slate-800/50 rounded-2xl text-sm">Пар на этой неделе нет</div>';
        }

        // ================= ОЦЕНКИ =================
        function extractSheetId(link) {
            const match = String(link || '').match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }

        async function fetchGroupsList() {
            const link = document.getElementById('sheetLinkInput').value.trim();
            const sheetId = extractSheetId(link);
            if (!sheetId) { alert("Вставьте ссылку на Google Таблицу!"); return; }
            const btn = document.getElementById('scanTabsBtn');
            btn.innerText = "⏳ Ищем...";
            document.getElementById('groupSelectBlock').classList.add('hidden');
            document.getElementById('studentSelectBlock').classList.add('hidden');
            try {
                const res = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=xlsx`);
                if (!res.ok) throw new Error("Проверьте доступ к таблице");
                const arrayBuffer = await res.arrayBuffer();
                tempMarksWorkbook = XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
                renderSheetGroupButtons(tempMarksWorkbook.SheetNames || []);
                document.getElementById('groupSelectBlock').classList.remove('hidden');
            } catch (e) { alert("Ошибка: " + e.message); } finally { btn.innerText = "Найти группы"; }
        }

        function renderSheetGroupButtons(tabs) {
            const container = document.getElementById('groupsButtonsContainer');
            container.innerHTML = '';
            tabs.forEach(tabName => {
                const isSelected = selectedGroupForMarks === tabName;
                const cls = isSelected ? "bg-indigo-600 border-indigo-400 text-white shadow" : "bg-slate-900 hover:bg-indigo-600/30 border-slate-700 text-slate-200";
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `px-3.5 py-2 border rounded-xl text-xs font-bold transition ${cls}`;
                btn.textContent = `👥 ${tabName}`;
                btn.onclick = () => selectGroupForMarks(tabName);
                container.appendChild(btn);
            });
        }

        function analyzeMatrix(matrix) {
            let bestCol = 1, maxNamesCount = 0;
            const maxCols = Math.min(10, matrix[0] ? matrix[0].length : 0);
            for (let col = 0; col < maxCols; col++) {
                let count = 0;
                for (let row = 0; row < matrix.length; row++) {
                    let cell = String(matrix[row][col] || '').trim();
                    if (/[а-яёА-ЯЁ]{2,}\s+[а-яёА-ЯЁ]{2,}/.test(cell) && !/(задание|лекция|практика|модуль|вопрос|итог|экзамен|фамилия)/i.test(cell)) count++;
                }
                if (count > maxNamesCount) { maxNamesCount = count; bestCol = col; }
            }
            let firstStudRow = 1;
            for (let row = 0; row < matrix.length; row++) {
                let cell = String(matrix[row][bestCol] || '').trim();
                if (/[а-яёА-ЯЁ]{2,}\s+[а-яёА-ЯЁ]{2,}/.test(cell) && !/(фио|студент|фамилия|список)/i.test(cell)) { firstStudRow = row; break; }
            }
            return { nameColIdx: bestCol, firstStudentRow: firstStudRow };
        }

        async function selectGroupForMarks(groupName) {
            if (!groupName) return;
            selectedGroupForMarks = groupName;
            if (tempMarksWorkbook) renderSheetGroupButtons(tempMarksWorkbook.SheetNames);
            try {
                let matrix = [];
                if (tempMarksWorkbook && tempMarksWorkbook.Sheets[groupName]) {
                    matrix = XLSX.utils.sheet_to_json(tempMarksWorkbook.Sheets[groupName], { header: 1, defval: "", raw: false });
                } else {
                    const sheetId = extractSheetId(document.getElementById('sheetLinkInput').value.trim());
                    const res = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(groupName)}&_t=${Date.now()}`);
                    matrix = Papa.parse(await res.text(), { skipEmptyLines: true }).data;
                }
                const { nameColIdx, firstStudentRow } = analyzeMatrix(matrix);
                const select = document.getElementById('studentSelect');
                select.innerHTML = '<option value="">-- Выберите своё ФИО --</option>';
                for (let r = firstStudentRow; r < matrix.length; r++) {
                    let name = String(matrix[r][nameColIdx] || '').trim();
                    if (name && /[а-яёА-ЯЁ]{2,}/.test(name) && isNaN(name) && !/(фамилия|фио|студент)/i.test(name)) {
                        const opt = document.createElement('option');
                        opt.value = name; opt.textContent = name; select.appendChild(opt);
                    }
                }
                document.getElementById('studentSelectBlock').classList.remove('hidden');
            } catch (err) { alert("Ошибка: " + err.message); }
        }

        function saveSubjectProfile() {
            let subjName = document.getElementById('subjectNameInput').value.trim();
            const link = document.getElementById('sheetLinkInput').value.trim();
            const studentName = document.getElementById('studentSelect').value;
            if (!studentName) { alert("Выберите свое ФИО!"); return; }
            if (!subjName) subjName = "Предмет " + (subjects.length + 1);
            subjects.push({ subjectName: subjName, sheetId: extractSheetId(link), groupName: selectedGroupForMarks, studentName });
            localStorage.setItem(STORAGE_MARKS_KEY, JSON.stringify(subjects));
            activeSubjectIndex = subjects.length - 1;
            switchSection('marks');
        }

        function openAddSubject() {
            document.getElementById('marksSection').classList.add('hidden');
            document.getElementById('scheduleSection').classList.add('hidden');
            document.getElementById('changesSection').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
            document.getElementById('groupSelectBlock').classList.add('hidden');
            document.getElementById('studentSelectBlock').classList.add('hidden');
            document.getElementById('subjectNameInput').value = '';
            document.getElementById('sheetLinkInput').value = '';
            selectedGroupForMarks = '';
            tempMarksWorkbook = null;
        }

        function renderSubjectTabs() {
            const container = document.getElementById('subjectsTabs');
            container.innerHTML = '';
            if (subjects.length === 0) {
                container.innerHTML = `<button type="button" onclick="openAddSubject()" class="text-xs bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 px-3 py-2 rounded-xl">➕ Добавить первый предмет</button>`;
                return;
            }
            subjects.forEach((subj, idx) => {
                const isActive = idx === activeSubjectIndex;
                container.innerHTML += `
                    <div class="flex items-center rounded-xl border ${isActive ? "bg-indigo-600 text-white border-indigo-500 shadow-md" : "bg-slate-800 text-slate-400 border-slate-700"} px-3 py-2 text-xs font-medium shrink-0 cursor-pointer" onclick="switchSubject(${idx})">
                        <span>${subj.subjectName}</span>
                        <button type="button" onclick="deleteSubject(event, ${idx})" class="ml-2 text-slate-300 hover:text-red-400">✕</button>
                    </div>
                `;
            });
        }

        function switchSubject(idx) { activeSubjectIndex = idx; renderSubjectTabs(); loadMarksForActiveSubject(); }
        function deleteSubject(event, idx) {
            event.stopPropagation();
            if (confirm(`Удалить предмет «${subjects[idx].subjectName}»?`)) {
                subjects.splice(idx, 1);
                localStorage.setItem(STORAGE_MARKS_KEY, JSON.stringify(subjects));
                activeSubjectIndex = 0;
                switchSection('marks');
            }
        }

        async function loadMarksForActiveSubject() {
            const current = subjects[activeSubjectIndex];
            const container = document.getElementById('marksList');
            const studentCard = document.getElementById('studentCard');
            if (!current) {
                studentCard.classList.add('hidden');
                container.innerHTML = `<div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 text-center space-y-3"><div class="text-slate-400 text-sm">Оценки не добавлены</div><button type="button" onclick="openAddSubject()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2.5 rounded-xl transition">➕ Подключить оценки</button></div>`;
                return;
            }
            studentCard.classList.remove('hidden');
            document.getElementById('studentDisplay').innerText = current.studentName;
            document.getElementById('groupDisplay').innerText = `Группа: ${current.groupName} • ${current.subjectName}`;
            container.innerHTML = '<div class="text-center text-slate-400 py-8 animate-pulse text-sm">Загружаем оценки...</div>';
            try {
                const url = `https://docs.google.com/spreadsheets/d/${current.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(current.groupName)}&_t=${Date.now()}`;
                const csvText = await (await fetch(url)).text();
                Papa.parse(csvText, {
                    skipEmptyLines: true,
                    complete: function(results) {
                        const matrix = results.data;
                        const { nameColIdx, firstStudentRow } = analyzeMatrix(matrix);
                        let studentRow = matrix.slice(firstStudentRow).find(r => String(r[nameColIdx] || '').trim() === current.studentName);
                        if (!studentRow) { container.innerHTML = '<div class="text-red-400 text-center py-6 text-sm bg-slate-800 rounded-2xl">Студент не найден</div>'; return; }
                        const headers = [];
                        for (let c = 0; c < studentRow.length; c++) {
                            let parts = [];
                            for (let r = 0; r < firstStudentRow; r++) {
                                let cell = String(matrix[r][c] || '').replace(/\s+/g, ' ').trim();
                                if (cell && !parts.includes(cell)) parts.push(cell);
                            }
                            headers[c] = parts.join(' • ') || `Колонка ${c + 1}`;
                        }
                        let html = '', count = 0;
                        for (let c = 0; c < studentRow.length; c++) {
                            if (c === nameColIdx || c === 0) continue;
                            let rawHeader = headers[c];
                            let val = String(studentRow[c] || '').trim();
                            if (!val || val === '—' || val === '-' || /#(DIV|ДЕЛ|VALUE|ЗНАЧ|REF|Н\/Д)/i.test(val)) continue;
                            if (/^(№|п\/п|№\s*п\/п)$/i.test(rawHeader)) continue;
                            html += `
                                <div class="bg-slate-800 p-3.5 rounded-xl flex justify-between items-center shadow border border-slate-700/40">
                                    <span class="text-xs sm:text-sm text-slate-200 pr-3 leading-snug">${rawHeader}</span>
                                    <span class="bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 font-bold px-3 py-1 rounded-lg text-sm shrink-0">${val}</span>
                                </div>
                            `;
                            count++;
                        }
                        container.innerHTML = count === 0 ? '<div class="text-slate-400 text-center py-8 bg-slate-800/50 rounded-2xl text-sm">Пока нет оценок</div>' : html;
                    }
                });
            } catch (e) { container.innerHTML = `<div class="text-red-400 text-center py-6 bg-slate-800 rounded-2xl text-sm">Ошибка: ${e.message}</div>`; }
        }

        function hardReset() { if (confirm("Сбросить все настройки?")) { localStorage.clear(); location.reload(); } }
    </script>
