<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мой Дневник ПТК</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- PapaParse для CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- SheetJS (xlsx) для чтения Google Таблиц (.xlsx) и файлов расписания -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 select-none pb-24">

    <div class="max-w-md mx-auto space-y-4">
        <!-- Шапка -->
        <div class="flex justify-between items-center bg-slate-800/60 p-3.5 rounded-2xl border border-slate-700/50">
            <div class="flex items-center gap-2">
                <span class="text-xl">📊</span>
                <h1 class="text-lg font-bold tracking-tight">Дневник ПТК</h1>
                <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full font-mono">v2.8</span>
            </div>
            <button onclick="hardReset()" class="text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-xl transition">
                Сброс
            </button>
        </div>

        <!-- Переключатель основных разделов (ВСЕГДА ДОСТУПЕН) -->
        <div id="mainNav" class="grid grid-cols-2 gap-2">
            <button onclick="switchSection('marks')" id="navMarksBtn" class="bg-indigo-600 text-white py-2.5 rounded-xl font-medium text-xs transition shadow-md shadow-indigo-600/20 flex items-center justify-center gap-1.5">
                <span>📊</span> Оценки
            </button>
            <button onclick="switchSection('schedule')" id="navScheduleBtn" class="bg-slate-800 text-slate-400 border border-slate-700 py-2.5 rounded-xl font-medium text-xs transition flex items-center justify-center gap-1.5 hover:text-slate-200">
                <span>📅</span> Расписание
            </button>
        </div>

        <!-- РАЗДЕЛ 1: ОЦЕНКИ -->
        <div id="marksSection" class="space-y-4">
            <div class="space-y-2">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Мои предметы</span>
                    <button onclick="openAddSubject()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1">
                        ➕ Добавить предмет
                    </button>
                </div>
                <div id="subjectsTabs" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>
            </div>

            <!-- Карточка студента (скрывается, если нет предметов) -->
            <div id="studentCard" class="bg-slate-800 p-4 rounded-2xl flex justify-between items-center shadow-lg border border-slate-700/50 hidden">
                <div>
                    <div id="studentDisplay" class="font-bold text-base text-white">ФИО Студента</div>
                    <div id="groupDisplay" class="text-xs text-slate-400 mt-0.5">Группа</div>
                </div>
                <button onclick="loadMarksForActiveSubject()" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-3.5 py-2 rounded-xl text-xs font-medium flex items-center gap-1.5 transition shadow-lg shadow-indigo-600/20">
                    🔄 Обновить
                </button>
            </div>

            <div id="marksList" class="space-y-2.5"></div>
        </div>

        <!-- РАЗДЕЛ 2: РАСПИСАНИЕ -->
        <div id="scheduleSection" class="space-y-4 hidden">
            <div class="space-y-2">
                <div class="flex justify-between items-center px-1">
                    <span class="text-xs text-slate-400 font-medium uppercase tracking-wider">Мои группы расписания</span>
                    <button onclick="openAddSchedule()" class="text-xs text-indigo-400 hover:text-indigo-300 font-medium flex items-center gap-1">
                        📁 Загрузить файл
                    </button>
                </div>
                <div id="scheduleTabs" class="flex gap-2 overflow-x-auto pb-1 no-scrollbar"></div>
            </div>

            <div class="bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700/50 space-y-3">
                <div class="flex justify-between items-center">
                    <div>
                        <div id="schedHeaderInfo" class="font-bold text-sm text-white">Расписание не выбрано</div>
                        <div id="schedSubInfo" class="text-xs text-slate-400 mt-0.5">Загрузите Excel-файл расписания</div>
                    </div>
                    <button onclick="loadScheduleForActive()" class="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-xl text-xs transition">
                        🔄
                    </button>
                </div>

                <div class="grid grid-cols-2 gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-700/60">
                    <button onclick="setWeekType('upper')" id="btnUpperWeek" class="py-2 rounded-lg text-xs font-medium transition bg-indigo-600 text-white shadow">
                        ⬆️ Верхняя неделя
                    </button>
                    <button onclick="setWeekType('lower')" id="btnLowerWeek" class="py-2 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white">
                        ⬇️ Нижняя неделя
                    </button>
                </div>
            </div>

            <div id="scheduleList" class="space-y-3">
                <div class="text-slate-400 text-center py-8 bg-slate-800/40 rounded-2xl text-sm">Загрузите файл расписания (.xls / .xlsx)</div>
            </div>
        </div>

        <!-- ЭКРАН НАСТРОЙКИ ПРЕДМЕТА (ОЦЕНКИ) -->
        <div id="setupScreen" class="bg-slate-800 p-5 rounded-2xl shadow-lg space-y-4 border border-slate-700/50 hidden">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-base">Подключение предмета (оценки)</h2>
                <button onclick="switchSection('marks')" class="text-xs text-slate-400 hover:text-white">Отмена</button>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">1. Название предмета</label>
                <input type="text" id="subjectNameInput" placeholder="Например: Дискретная математика" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">2. Ссылка на Google Таблицу</label>
                <div class="flex gap-2">
                    <input type="text" id="sheetLinkInput" placeholder="https://docs.google.com/spreadsheets/d/..." class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                    <button id="scanTabsBtn" onclick="fetchGroupsList()" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 px-4 rounded-xl text-xs font-semibold shrink-0 transition shadow-md shadow-indigo-600/20">
                        Найти группы
                    </button>
                </div>
            </div>

            <!-- Блок с кнопками найденных в таблице групп -->
            <div id="groupSelectBlock" class="hidden space-y-2.5 pt-3 border-t border-slate-700/60">
                <label class="block text-xs text-emerald-400 font-medium">3. Выберите вашу группу (вкладку таблицы):</label>
                <div id="groupsButtonsContainer" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Блок выбора студента -->
            <div id="studentSelectBlock" class="hidden space-y-3 pt-3 border-t border-slate-700">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">4. Выберите своё ФИО из списка:</label>
                    <select id="studentSelect" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-indigo-500">
                        <option value="">Выбери фамилию...</option>
                    </select>
                </div>
                <button onclick="saveSubjectProfile()" class="w-full bg-emerald-600 hover:bg-emerald-500 font-medium py-3 rounded-xl transition shadow-lg shadow-emerald-600/20">
                    ✅ Сохранить предмет
                </button>
            </div>
        </div>

        <!-- ЭКРАН НАСТРОЙКИ РАСПИСАНИЯ -->
        <div id="setupScheduleScreen" class="bg-slate-800 p-5 rounded-2xl shadow-lg space-y-4 border border-slate-700/50 hidden">
            <div class="flex justify-between items-center">
                <h2 class="font-bold text-base">Загрузка файла расписания</h2>
                <button onclick="switchSection('schedule')" class="text-xs text-slate-400 hover:text-white">Отмена</button>
            </div>

            <div>
                <label class="block text-xs text-slate-400 mb-1">1. Выберите файл расписания (.xls / .xlsx)</label>
                <input type="file" id="excelFileInput" accept=".xls, .xlsx" onchange="handleExcelFileSelect(event)" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-slate-300 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
            </div>

            <div id="excelGroupsBlock" class="hidden space-y-2 pt-2 border-t border-slate-700">
                <label class="block text-xs text-emerald-400 font-medium">2. Выберите вашу группу (найдены в файле):</label>
                <div id="excelGroupsButtons" class="flex flex-wrap gap-2"></div>
            </div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const STORAGE_MARKS_KEY = 'ptk_diary_subjects_v3';
        const STORAGE_SCHED_KEY = 'ptk_diary_schedules_v6';
        
        let subjects = [];
        let activeSubjectIndex = 0;
        let schedules = [];
        let activeScheduleIndex = 0;
        let currentSelectedWeek = 'upper';
        let selectedGroupForMarks = '';

        let tempMarksWorkbook = null;
        let tempExcelData = null;

        window.onload = function() {
            const savedMarks = localStorage.getItem(STORAGE_MARKS_KEY);
            if (savedMarks) { try { subjects = JSON.parse(savedMarks); } catch(e){} }

            const savedSched = localStorage.getItem(STORAGE_SCHED_KEY);
            if (savedSched) { try { schedules = JSON.parse(savedSched); } catch(e){} }

            currentSelectedWeek = getInitialWeekType();
            updateWeekButtonsUI();

            // Если оценок нет, но есть расписание — сразу открываем расписание. Иначе открываем главный экран без принудительной формы.
            if (subjects.length === 0 && schedules.length > 0) {
                switchSection('schedule');
            } else {
                switchSection('marks');
            }
        };

        function getInitialWeekType() {
            const now = new Date();
            const year = now.getMonth() >= 8 ? now.getFullYear() : now.getFullYear() - 1;
            const septFirst = new Date(year, 8, 1);
            const diffDays = Math.ceil(Math.abs(now - septFirst) / (1000 * 60 * 60 * 24));
            return (Math.ceil(diffDays / 7) % 2 !== 0) ? 'upper' : 'lower';
        }

        function setWeekType(type) {
            currentSelectedWeek = type;
            updateWeekButtonsUI();
            loadScheduleForActive();
        }

        function updateWeekButtonsUI() {
            const btnUpper = document.getElementById('btnUpperWeek');
            const btnLower = document.getElementById('btnLowerWeek');
            if (currentSelectedWeek === 'upper') {
                btnUpper.className = "py-2 rounded-lg text-xs font-medium transition bg-indigo-600 text-white shadow";
                btnLower.className = "py-2 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white";
            } else {
                btnLower.className = "py-2 rounded-lg text-xs font-medium transition bg-indigo-600 text-white shadow";
                btnUpper.className = "py-2 rounded-lg text-xs font-medium transition text-slate-400 hover:text-white";
            }
        }

        function switchSection(section) {
            document.getElementById('mainNav').classList.remove('hidden');
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('setupScheduleScreen').classList.add('hidden');

            const marksBtn = document.getElementById('navMarksBtn');
            const schedBtn = document.getElementById('navScheduleBtn');
            const marksSec = document.getElementById('marksSection');
            const schedSec = document.getElementById('scheduleSection');

            if (section === 'marks') {
                marksBtn.className = "bg-indigo-600 text-white py-2.5 rounded-xl font-medium text-xs transition shadow-md shadow-indigo-600/20 flex items-center justify-center gap-1.5";
                schedBtn.className = "bg-slate-800 text-slate-400 border border-slate-700 py-2.5 rounded-xl font-medium text-xs transition flex items-center justify-center gap-1.5 hover:text-slate-200";
                marksSec.classList.remove('hidden');
                schedSec.classList.add('hidden');
                renderSubjectTabs();
                loadMarksForActiveSubject();
            } else {
                schedBtn.className = "bg-indigo-600 text-white py-2.5 rounded-xl font-medium text-xs transition shadow-md shadow-indigo-600/20 flex items-center justify-center gap-1.5";
                marksBtn.className = "bg-slate-800 text-slate-400 border border-slate-700 py-2.5 rounded-xl font-medium text-xs transition flex items-center justify-center gap-1.5 hover:text-slate-200";
                schedSec.classList.remove('hidden');
                marksSec.classList.add('hidden');
                renderScheduleTabs();
                loadScheduleForActive();
            }
        }

        function extractSheetId(link) {
            const match = link.match(/\/d\/([a-zA-Z0-9-_]+)/);
            return match ? match[1] : null;
        }

        // --- ОЦЕНКИ: ПРЯМОЕ СКАЧИВАНИЕ ВСЕХ ВКЛАДОК ТАБЛИЦЫ ЧЕРЕЗ XLSX ---
        async function fetchWorkbookFromGoogle(sheetId) {
            const exportUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=xlsx`;
            const res = await fetch(exportUrl);
            if (!res.ok) throw new Error("Не удалось загрузить таблицу. Проверьте доступ по ссылке.");
            const arrayBuffer = await res.arrayBuffer();
            return XLSX.read(new Uint8Array(arrayBuffer), { type: 'array' });
        }

        async function fetchGroupsList() {
            const link = document.getElementById('sheetLinkInput').value.trim();
            const sheetId = extractSheetId(link);
            if (!sheetId) { alert("Сначала вставьте ссылку на Google Таблицу!"); return; }

            const btn = document.getElementById('scanTabsBtn');
            btn.innerText = "⏳ Ищем...";
            document.getElementById('groupSelectBlock').classList.add('hidden');
            document.getElementById('studentSelectBlock').classList.add('hidden');

            try {
                const workbook = await fetchWorkbookFromGoogle(sheetId);
                tempMarksWorkbook = workbook;

                const tabs = workbook.SheetNames || [];
                if (tabs.length === 0) throw new Error("В таблице не найдено вкладок");

                renderSheetGroupButtons(tabs);
                document.getElementById('groupSelectBlock').classList.remove('hidden');
            } catch (e) {
                alert("Ошибка чтения групп: " + e.message);
            } finally {
                btn.innerText = "Найти группы";
            }
        }

        function renderSheetGroupButtons(tabs) {
            const container = document.getElementById('groupsButtonsContainer');
            container.innerHTML = '';

            tabs.forEach(tabName => {
                const isSelected = selectedGroupForMarks === tabName;
                const btnStyle = isSelected
                    ? "bg-indigo-600 border-indigo-400 text-white shadow-md shadow-indigo-600/30"
                    : "bg-slate-900 hover:bg-indigo-600/30 border-slate-700 text-slate-200";

                const safeName = tabName.replace(/'/g, "\\'");
                container.innerHTML += `
                    <button onclick="selectGroupForMarks('${safeName}')" class="px-3.5 py-2 border rounded-xl text-xs font-bold transition active:scale-95 ${btnStyle}">
                        👥 ${tabName}
                    </button>
                `;
            });
        }

        function analyzeMatrix(matrix) {
            let bestCol = 1;
            let maxNamesCount = 0;
            const maxCols = Math.min(10, matrix[0] ? matrix[0].length : 0);

            for (let col = 0; col < maxCols; col++) {
                let namesCount = 0;
                for (let row = 0; row < matrix.length; row++) {
                    let cell = (matrix[row][col] || '').toString().trim();
                    if (/[а-яёА-ЯЁ]{2,}\s+[а-яёА-ЯЁ]{2,}/.test(cell) && !/(задание|лекция|практика|модуль|вопрос|итог|экзамен|дисциплина|фамилия)/i.test(cell)) {
                        namesCount++;
                    }
                }
                if (namesCount > maxNamesCount) {
                    maxNamesCount = namesCount;
                    bestCol = col;
                }
            }

            let firstStudRow = 1;
            for (let row = 0; row < matrix.length; row++) {
                let cell = (matrix[row][bestCol] || '').toString().trim();
                if (/[а-яёА-ЯЁ]{2,}\s+[а-яёА-ЯЁ]{2,}/.test(cell) && !/(фио|студент|фамилия|список)/i.test(cell)) {
                    firstStudRow = row;
                    break;
                }
            }
            return { nameColIdx: bestCol, firstStudentRow: firstStudRow };
        }

        async function selectGroupForMarks(groupName) {
            if (!groupName) return;
            selectedGroupForMarks = groupName;

            if (tempMarksWorkbook) {
                renderSheetGroupButtons(tempMarksWorkbook.SheetNames);
            }

            try {
                let matrix = [];
                if (tempMarksWorkbook && tempMarksWorkbook.Sheets[groupName]) {
                    matrix = XLSX.utils.sheet_to_json(tempMarksWorkbook.Sheets[groupName], { header: 1, defval: "", raw: false });
                } else {
                    const link = document.getElementById('sheetLinkInput').value.trim();
                    const sheetId = extractSheetId(link);
                    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(groupName)}&_t=${Date.now()}`;
                    const res = await fetch(url);
                    const csvText = await res.text();
                    const parsed = Papa.parse(csvText, { skipEmptyLines: true });
                    matrix = parsed.data;
                }

                const { nameColIdx, firstStudentRow } = analyzeMatrix(matrix);
                const select = document.getElementById('studentSelect');
                select.innerHTML = '<option value="">-- Выберите своё ФИО --</option>';

                let count = 0;
                for (let r = firstStudentRow; r < matrix.length; r++) {
                    let name = (matrix[r][nameColIdx] || '').toString().trim();
                    if (name && /[а-яёА-ЯЁ]{2,}/.test(name) && isNaN(name) && !/(фамилия|фио|студент)/i.test(name)) {
                        select.innerHTML += `<option value="${name}">${name}</option>`;
                        count++;
                    }
                }

                if (count === 0) {
                    alert("В этой вкладке не найден список студентов.");
                    return;
                }
                document.getElementById('studentSelectBlock').classList.remove('hidden');
            } catch (err) {
                alert("Ошибка открытия группы: " + err.message);
            }
        }

        function saveSubjectProfile() {
            let subjName = document.getElementById('subjectNameInput').value.trim();
            const link = document.getElementById('sheetLinkInput').value.trim();
            const studentName = document.getElementById('studentSelect').value;

            if (!studentName) { alert("Выберите своё ФИО!"); return; }
            if (!subjName) subjName = "Предмет " + (subjects.length + 1);

            subjects.push({ subjectName: subjName, sheetId: extractSheetId(link), groupName: selectedGroupForMarks, studentName });
            localStorage.setItem(STORAGE_MARKS_KEY, JSON.stringify(subjects));
            activeSubjectIndex = subjects.length - 1;
            switchSection('marks');
        }

        function openAddSubject() {
            // Оставляем верхнее меню видимым, чтобы всегда можно было уйти в Расписание
            document.getElementById('mainNav').classList.remove('hidden');
            document.getElementById('marksSection').classList.add('hidden');
            document.getElementById('scheduleSection').classList.add('hidden');
            document.getElementById('setupScreen').classList.remove('hidden');
            document.getElementById('setupScheduleScreen').classList.add('hidden');
            document.getElementById('groupSelectBlock').classList.add('hidden');
            document.getElementById('studentSelectBlock').classList.add('hidden');
            document.getElementById('subjectNameInput').value = '';
            document.getElementById('sheetLinkInput').value = '';
            selectedGroupForMarks = '';
            tempMarksWorkbook = null;
        }

        function renderSubjectTabs() {
            const container = document.getElementById('subjectsTabs');
            container.innerHTML = '';

            if (subjects.length === 0) {
                container.innerHTML = `<button onclick="openAddSubject()" class="text-xs bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 px-3 py-2 rounded-xl">➕ Добавить первый предмет</button>`;
                return;
            }

            subjects.forEach((subj, idx) => {
                const isActive = idx === activeSubjectIndex;
                container.innerHTML += `
                    <div class="flex items-center rounded-xl border ${isActive ? "bg-indigo-600 text-white border-indigo-500 shadow-md" : "bg-slate-800 text-slate-400 border-slate-700"} px-3 py-2 text-xs font-medium shrink-0 cursor-pointer" onclick="switchSubject(${idx})">
                        <span>${subj.subjectName}</span>
                        <button onclick="deleteSubject(event, ${idx})" class="ml-2 text-slate-300 hover:text-red-400">✕</button>
                    </div>
                `;
            });
        }

        function switchSubject(idx) { activeSubjectIndex = idx; renderSubjectTabs(); loadMarksForActiveSubject(); }
        function deleteSubject(event, idx) {
            event.stopPropagation();
            if (confirm(`Удалить предмет «${subjects[idx].subjectName}»?`)) {
                subjects.splice(idx, 1);
                localStorage.setItem(STORAGE_MARKS_KEY, JSON.stringify(subjects));
                activeSubjectIndex = 0;
                switchSection('marks');
            }
        }

        async function loadMarksForActiveSubject() {
            const current = subjects[activeSubjectIndex];
            const container = document.getElementById('marksList');
            const studentCard = document.getElementById('studentCard');

            if (!current) {
                studentCard.classList.add('hidden');
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 text-center space-y-3">
                        <div class="text-slate-400 text-sm">У вас пока не добавлено ни одной таблицы с оценками</div>
                        <button onclick="openAddSubject()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20">
                            ➕ Подключить таблицу оценок
                        </button>
                    </div>
                `;
                return;
            }

            studentCard.classList.remove('hidden');
            document.getElementById('studentDisplay').innerText = current.studentName;
            document.getElementById('groupDisplay').innerText = `Группа: ${current.groupName} • ${current.subjectName}`;
            container.innerHTML = '<div class="text-center text-slate-400 py-8 animate-pulse text-sm">Загружаем оценки...</div>';

            try {
                const url = `https://docs.google.com/spreadsheets/d/${current.sheetId}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(current.groupName)}&_t=${Date.now()}`;
                const res = await fetch(url);
                const csvText = await res.text();

                Papa.parse(csvText, {
                    skipEmptyLines: true,
                    complete: function(results) {
                        const matrix = results.data;
                        const { nameColIdx, firstStudentRow } = analyzeMatrix(matrix);

                        let studentRow = null;
                        for (let r = firstStudentRow; r < matrix.length; r++) {
                            if ((matrix[r][nameColIdx] || '').toString().trim() === current.studentName) {
                                studentRow = matrix[r];
                                break;
                            }
                        }

                        if (!studentRow) {
                            container.innerHTML = '<div class="text-red-400 text-center py-6 text-sm bg-slate-800 rounded-2xl">Студент не найден</div>';
                            return;
                        }

                        const headers = [];
                        for (let c = 0; c < studentRow.length; c++) {
                            let parts = [];
                            for (let r = 0; r < firstStudentRow; r++) {
                                let cell = (matrix[r][c] || '').toString().replace(/\s+/g, ' ').trim();
                                if (cell && !parts.includes(cell)) parts.push(cell);
                            }
                            headers[c] = parts.join(' • ') || `Колонка ${c + 1}`;
                        }

                        let html = '', count = 0;
                        for (let c = 0; c < studentRow.length; c++) {
                            if (c === nameColIdx) continue;
                            let rawHeader = headers[c];
                            let val = (studentRow[c] || '').toString().trim();
                            if (!val || val === '—' || val === '-' || /#(DIV|ДЕЛ|VALUE|ЗНАЧ|REF|Н\/Д)/i.test(val)) continue;
                            if (/^(№|п\/п|№\s*п\/п)$/i.test(rawHeader) || c === 0) continue;

                            html += `
                                <div class="bg-slate-800 p-3.5 rounded-xl flex justify-between items-center shadow border border-slate-700/40">
                                    <span class="text-xs sm:text-sm text-slate-200 pr-3 leading-snug">${rawHeader}</span>
                                    <span class="bg-indigo-600/30 border border-indigo-500/30 text-indigo-300 font-bold px-3 py-1 rounded-lg text-sm shrink-0">${val}</span>
                                </div>
                            `;
                            count++;
                        }
                        container.innerHTML = count === 0 ? '<div class="text-slate-400 text-center py-8 bg-slate-800/50 rounded-2xl text-sm">Пока нет оценок</div>' : html;
                    }
                });
            } catch (e) {
                container.innerHTML = `<div class="text-red-400 text-center py-6 bg-slate-800 rounded-2xl text-sm">Ошибка: ${e.message}</div>`;
            }
        }

        // --- РАСПИСАНИЕ ---
        function openAddSchedule() {
            document.getElementById('mainNav').classList.remove('hidden');
            document.getElementById('marksSection').classList.add('hidden');
            document.getElementById('scheduleSection').classList.add('hidden');
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('setupScheduleScreen').classList.remove('hidden');
            document.getElementById('excelFileInput').value = '';
            document.getElementById('excelGroupsBlock').classList.add('hidden');
            tempExcelData = null;
        }

        function handleExcelFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    let foundGroups = [];
                    let allSheetsData = {};

                    workbook.SheetNames.forEach(sheetName => {
                        const sheet = workbook.Sheets[sheetName];
                        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
                        const merges = sheet['!merges'] || [];
                        allSheetsData[sheetName] = { rows, merges };

                        for (let r = 0; r < Math.min(15, rows.length); r++) {
                            for (let c = 0; c < rows[r].length; c++) {
                                let val = (rows[r][c] || '').toString().trim();
                                if (/^\d{4}[а-яa-z]*$/i.test(val) && !/^202\d$/.test(val)) {
                                    foundGroups.push({ groupName: val, sheetName: sheetName });
                                }
                            }
                        }
                    });

                    tempExcelData = { fileName: file.name, sheets: allSheetsData };

                    const btnContainer = document.getElementById('excelGroupsButtons');
                    btnContainer.innerHTML = '';

                    if (foundGroups.length === 0) {
                        alert("В этом файле не найдены номера групп.");
                        return;
                    }

                    foundGroups.forEach(g => {
                        btnContainer.innerHTML += `
                            <button onclick="saveScheduleGroup('${g.groupName}', '${g.sheetName}')" class="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white font-bold px-4 py-2.5 rounded-xl text-xs shadow transition">
                                👥 Группа ${g.groupName}
                            </button>
                        `;
                    });

                    document.getElementById('excelGroupsBlock').classList.remove('hidden');
                } catch (err) {
                    alert("Ошибка чтения Excel: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function saveScheduleGroup(groupName, sheetName) {
            if (!tempExcelData) return;
            const sheetObj = tempExcelData.sheets[sheetName];

            schedules.push({
                groupName: groupName,
                fileName: tempExcelData.fileName,
                rawRows: sheetObj.rows,
                merges: sheetObj.merges || []
            });

            localStorage.setItem(STORAGE_SCHED_KEY, JSON.stringify(schedules));
            activeScheduleIndex = schedules.length - 1;
            switchSection('schedule');
        }

        function renderScheduleTabs() {
            const container = document.getElementById('scheduleTabs');
            container.innerHTML = '';
            if (schedules.length === 0) {
                container.innerHTML = `<button onclick="openAddSchedule()" class="text-xs bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 px-3 py-2 rounded-xl">➕ Добавить расписание</button>`;
                return;
            }
            schedules.forEach((sch, idx) => {
                const isActive = idx === activeScheduleIndex;
                container.innerHTML += `
                    <div class="flex items-center rounded-xl border ${isActive ? "bg-indigo-600 text-white border-indigo-500 shadow-md" : "bg-slate-800 text-slate-400 border-slate-700"} px-3 py-2 text-xs font-medium shrink-0 cursor-pointer" onclick="switchSchedule(${idx})">
                        <span>Группа ${sch.groupName}</span>
                        <button onclick="deleteSchedule(event, ${idx})" class="ml-2 text-slate-300 hover:text-red-400">✕</button>
                    </div>
                `;
            });
        }

        function switchSchedule(idx) { activeScheduleIndex = idx; renderScheduleTabs(); loadScheduleForActive(); }
        function deleteSchedule(event, idx) {
            event.stopPropagation();
            if (confirm(`Удалить расписание группы ${schedules[idx].groupName}?`)) {
                schedules.splice(idx, 1);
                localStorage.setItem(STORAGE_SCHED_KEY, JSON.stringify(schedules));
                activeScheduleIndex = 0;
                switchSection('schedule');
            }
        }

        function isCellMergedVertically(merges, r, c) {
            if (!merges) return false;
            for (let m of merges) {
                if (m.s.r === r && m.e.r > r && c >= m.s.c && c <= m.e.c) {
                    return true;
                }
            }
            return false;
        }

        function loadScheduleForActive() {
            const current = schedules[activeScheduleIndex];
            const container = document.getElementById('scheduleList');
            if (!current || !current.rawRows) {
                document.getElementById('schedHeaderInfo').innerText = "Расписание не выбрано";
                document.getElementById('schedSubInfo').innerText = "Загрузите файл расписания выше";
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-slate-700/50 rounded-2xl p-6 text-center space-y-3">
                        <div class="text-slate-400 text-sm">У вас пока не загружено расписание</div>
                        <button onclick="openAddSchedule()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-medium px-4 py-2.5 rounded-xl transition shadow-lg shadow-indigo-600/20">
                            📁 Загрузить файл (.xls / .xlsx)
                        </button>
                    </div>
                `;
                return;
            }

            document.getElementById('schedHeaderInfo').innerText = `Группа: ${current.groupName} (${currentSelectedWeek === 'upper' ? 'Верхняя неделя' : 'Нижняя неделя'})`;
            document.getElementById('schedSubInfo').innerText = `Файл: ${current.fileName || 'Excel'}`;

            try {
                const rows = current.rawRows;
                const merges = current.merges || [];
                let groupColIdx = -1, headerRowIdx = -1;

                for (let r = 0; r < Math.min(15, rows.length); r++) {
                    for (let c = 0; c < rows[r].length; c++) {
                        if ((rows[r][c] || '').toString().trim() === current.groupName) {
                            groupColIdx = c; headerRowIdx = r; break;
                        }
                    }
                    if (groupColIdx !== -1) break;
                }

                if (groupColIdx === -1) {
                    container.innerHTML = `<div class="text-red-400 text-center py-6 bg-slate-800 rounded-2xl text-sm">Группа ${current.groupName} не найдена в файле</div>`;
                    return;
                }

                const timeColIdx = groupColIdx - 1;
                const dayColIdx = groupColIdx - 2;
                let daysSchedule = {};
                let currentDay = "Понедельник";

                for (let r = headerRowIdx + 1; r < rows.length; r++) {
                    let row = rows[r];
                    if (!row) continue;

                    let dayCandidate = ((row[dayColIdx] || row[0] || '')).toString().trim().toLowerCase();
                    if (/^(понедельник|вторник|среда|четверг|пятница|суббота)$/.test(dayCandidate)) {
                        currentDay = dayCandidate.charAt(0).toUpperCase() + dayCandidate.slice(1);
                    }

                    let timeVal = (row[timeColIdx] || row[1] || '').toString().trim();
                    if (!/\d{1,2}[\.:]\d{2}\s*-\s*\d{1,2}[\.:]\d{2}/.test(timeVal)) {
                        continue;
                    }

                    let upperVal = (rows[r][groupColIdx] || '').toString().trim();
                    let nextRow = rows[r + 1] || [];
                    let lowerVal = (nextRow[groupColIdx] || '').toString().trim();

                    let nextTimeVal = (nextRow[timeColIdx] || nextRow[1] || '').toString().trim();
                    let hasSecondRow = !(/\d{1,2}[\.:]\d{2}\s*-\s*\d{1,2}[\.:]\d{2}/.test(nextTimeVal));

                    let isMerged = isCellMergedVertically(merges, r, groupColIdx);

                    if (isMerged || !hasSecondRow) {
                        lowerVal = upperVal;
                    }

                    let chosenLesson = currentSelectedWeek === 'upper' ? upperVal : lowerVal;

                    if (chosenLesson && chosenLesson !== '-' && chosenLesson !== '—' && !/Зам\.\s*директора/i.test(chosenLesson)) {
                        if (!daysSchedule[currentDay]) daysSchedule[currentDay] = [];
                        daysSchedule[currentDay].push({
                            time: timeVal,
                            lesson: chosenLesson,
                            onlyThisWeek: (!isMerged && hasSecondRow && upperVal !== lowerVal)
                        });
                    }
                }

                let html = '';
                for (let [day, lessons] of Object.entries(daysSchedule)) {
                    html += `
                        <div class="bg-slate-800 p-4 rounded-2xl shadow border border-slate-700/40 space-y-2">
                            <h3 class="font-bold text-indigo-400 text-sm border-b border-slate-700/60 pb-1.5">${day}</h3>
                            <div class="space-y-1.5">
                    `;
                    lessons.forEach(l => {
                        const badge = l.onlyThisWeek
                            ? `<span class="text-[10px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded ml-1">${currentSelectedWeek === 'upper' ? 'верх' : 'низ'}</span>`
                            : '';
                        html += `
                            <div class="text-xs flex gap-2.5 items-start bg-slate-900/50 p-2.5 rounded-xl border border-slate-700/30">
                                <span class="font-mono text-indigo-300 font-semibold shrink-0 pt-0.5">${l.time}</span>
                                <div class="text-slate-200 leading-snug">${l.lesson} ${badge}</div>
                            </div>
                        `;
                    });
                    html += `</div></div>`;
                }

                container.innerHTML = html || '<div class="text-slate-400 text-center py-8 bg-slate-800/50 rounded-2xl text-sm">Пар на этой неделе нет</div>';
            } catch (e) {
                container.innerHTML = `<div class="text-red-400 text-center py-6 bg-slate-800 rounded-2xl text-sm">Ошибка: ${e.message}</div>`;
            }
        }

        function hardReset() { if (confirm("Сбросить все оценки и расписания?")) { localStorage.clear(); location.reload(); } }
    </script>
